<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="ISO-8859-1">
	<title>Task Management System</title>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<script src="https://kit.fontawesome.com/65b0cd8812.js" crossorigin="anonymous"></script>
	<style>
		button,
		.log {
			width: min-content;
		}

		.log {
			padding: 0%;
			margin-bottom: 0%;
		}

		td {
			font-size: small;
		}

		abbr:hover {
			cursor: pointer;
		}
		.emm{
			color: rgb(181, 71, 184);
		}
	</style>
</head>

<body>

	<div class="container-fluid my-2">
		<div class="d-flex justify-content-between">
			<h1 class="text-info ">Tasks List</h1>
			<a th:href="@{/}">
				<abbr title="Logout"><i class="fa-solid fa-right-from-bracket fa-lg" style="color: #1ddfed;"></i></abbr>
			</a>

		</div>
		<div class="d-flex justify-content-end emm">
		    <p th:if="${loggedInUser != null}">
		        Welcome, <em th:text="${loggedInUser.name}"></em>
		    </p>
		</div>
		<table border="1" class="table table-striped table-hover table-responsive-md ">
			<thead>
				<tr>

					<th>Task Name</th>
					<th>Task Description</th>
					<th>Status</th>
					<th>Task Assignee</th>
					<th>Task Reporting</th>
					<th>Task Estimate Time</th>
					<th>Task Spent Time</th>
					<th>Task Date</th>
					<th> Actions </th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="tasks : ${listTasks}">

					<td th:text="${tasks.name}"></td>
					<td th:text="${tasks.description}"></td>
					<td th:text="${tasks.status}"></td>
					<td th:text="${tasks.assignee}"></td>
					<td th:text="${tasks.reporting}"></td>
					<td th:text="${tasks.estimatetime}"></td>
					<td th:text="${tasks.spenttime}"></td>
					<td th:text="${tasks.tdate}"></td>
					<td>
						<abbr title="Edit"><a th:href="@{/showFormForUpdate/{id}(id=${tasks.id})}"
								class="btn btn-outline-success">
								<i class="fa-solid fa-square-pen" style="color: rgb(32, 198, 49);"></i>
							</a></abbr>

						<abbr title="Delete">
							<a th:href="@{/deleteTasks/{id}(id=${tasks.id})}" class="btn btn-outline-danger">
								<i class="fa-solid fa-trash-can fa-flip-horizontal" style="color: rgb(255, 0, 0);"></i>
							</a></abbr>
					</td>
				</tr>
			</tbody>
		</table>
		<a th:href="@{/showNewTasksForm}" class="btn btn-outline-primary mt-4"> Add Task </a>
	</div>
</body>

</html>
